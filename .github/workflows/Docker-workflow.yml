name: Docker-Login-Build-Push
on:
  push:
    tags:
      - 'v*'
# creating env instead of hard coding
env:
  DOCKER_HUB_REPO: dockerfile
jobs:
  build_and_push:
    name: Build docker image and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: metadata tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      
      - name: Push to Docker Hub
        id: docker_build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./web-content/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
